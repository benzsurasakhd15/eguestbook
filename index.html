<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><title>eGuestbook</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}.app{min-height:100svh;position:relative;padding:12px;border:1px solid #eee}.frame{position:absolute;inset:20px;border:1px solid #eee;border-radius:3px;pointer-events:none}.top{display:flex;justify-content:space-between;position:relative;z-index:20;font-weight:bold;font-size:14px}.rec:after{content:"";display:inline-block;width:12px;height:12px;background:#e3081b;border-radius:50%;margin-left:7px}.time{text-align:center;position:absolute;z-index:10;top:20px;left:0;right:0;font-variant-numeric:tabular-nums}.badge{position:absolute;z-index:10;bottom:20px;left:20px}.focus{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;pointer-events:none}.controls{position:absolute;z-index:20;bottom:28px;left:0;right:0;text-align:center}.record{width:66px;height:66px;border:5px solid #ddd;border-radius:50%;background:#fff;cursor:pointer}.record:after{content:"";display:block;width:22px;height:22px;margin:auto;border-radius:50%;background:#e3081b}.record.live:after{border-radius:4px}.status{font-size:13px}.admin{min-width:48px;min-height:44px;background:#111;color:#fff;border:1px solid #aaa;border-radius:4px;cursor:pointer;font-size:12px}.modal{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:#000b;padding:20px}.card{width:min(360px,100%);background:#1b1b1b;padding:20px;border:1px solid #666;border-radius:10px}.hidden{display:none}input,select{width:100%;padding:11px;margin:8px 0;background:#111;color:#fff;border:1px solid #777;border-radius:6px}button{font:inherit}.card button{padding:10px;margin:4px 3px 0 0;border:0;border-radius:6px;background:#eee;color:#111}.card button.danger{background:#bd2630;color:#fff}.media{border-top:1px solid #555;padding:12px 0;display:flex;justify-content:space-between;font-size:13px}@media(orientation:landscape){.app{min-height:100vh}.frame{inset:12px 20%}.badge{left:21%}.controls{left:auto;right:3%;width:100px}.top{padding:4px 8px}.time{top:16px}}
</style></head><body><main class="app"><div class="frame" id="frame"></div><div class="top"><span class="rec">REC</span><button class="admin" id="admin">ADMIN</button></div><div class="time" id="time">00:00:00:00</div><div class="focus" id="count"></div><span class="badge">4K</span><section class="controls"><button class="record" id="record" aria-label="เริ่มบันทึก"></button><p class="status" id="status">พร้อมบันทึก</p></section></main><div class="modal hidden" id="modal"><section class="card" id="login"><h2>Admin</h2><input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN 6 หลัก"><button id="unlock">เข้าสู่ระบบ</button><button id="close">ปิด</button></section><section class="card hidden" id="settings"><h2>ตั้งค่า</h2><p id="total">บันทึกวิดีโอแล้ว 0 รายการ</p><select id="duration"><option value="60">1 นาที</option><option value="180">3 นาที</option><option value="300">5 นาที</option><option value="600">10 นาที</option></select><input id="overlay" type="file" accept="image/png,image/webp"><button id="library">จัดการรูปและวิดีโอ</button><button id="install">ติดตั้งแอป</button><button id="settingsClose">ปิด</button></section><section class="card hidden" id="files"><h2>คลังสื่อ</h2><div id="list"></div><button id="back">กลับ</button></section><section class="card hidden" id="confirm"><h2>ลบไฟล์นี้หรือไม่?</h2><p id="fileName"></p><p>กรอก PIN 6 หลักเพื่อยืนยันการลบถาวร</p><input id="deletePin" inputmode="numeric" maxlength="6" placeholder="PIN 6 หลัก"><button class="danger" id="delete">ลบถาวร</button><button id="cancel">ยกเลิก</button></section></div><script>
const $=x=>document.getElementById(x),wait=t=>new Promise(r=>setTimeout(r,t));let active=false,run=0,total=0,pending=null,media=['eGuestbook_20260915_1830.mp4','eGuestbook_20260915_1812.jpg'],installPrompt;
const view=n=>['login','settings','files','confirm'].forEach(x=>$(x).classList.toggle('hidden',x!==n));const reset=()=>{run++;active=false;$('count').textContent='';$('time').textContent='00:00:00:00';$('record').classList.remove('live')};$('record').onclick=async()=>{if(active){reset();$('status').textContent='หยุดการบันทึกแล้ว';return}active=true;let id=++run;for(let n=5;n;n--){$('count').textContent=n;$('status').textContent='กำลังนับถอยหลัง';await wait(1000);if(id!==run)return}$('count').textContent='';$('record').classList.add('live');for(let n=+$('duration').value;n;n--){$('time').textContent=n<=5?'สิ้นสุดการบันทึกใน '+n+' วินาที':`00:${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;await wait(1000);if(id!==run)return}total++;$('total').textContent='บันทึกวิดีโอแล้ว '+total+' รายการ';$('status').textContent='บันทึกเรียบร้อย';reset()};$('admin').onclick=()=>{$('modal').classList.remove('hidden');view('login')};$('close').onclick=()=>$('modal').classList.add('hidden');$('settingsClose').onclick=()=>$('modal').classList.add('hidden');$('unlock').onclick=()=>{if($('pin').value==='123456')view('settings')};$('overlay').onchange=e=>{let f=e.target.files[0];if(f){$('frame').style.background=`url(${URL.createObjectURL(f)}) center/100% 100% no-repeat`}};function render(){ $('list').innerHTML=media.map((m,i)=>`<div class="media">${m}<button onclick="choose(${i})">ลบ</button></div>`).join('')||'<p>ยังไม่มีไฟล์</p>'}window.choose=i=>{pending=i;$('fileName').textContent=media[i];view('confirm')};$('library').onclick=()=>{render();view('files')};$('back').onclick=()=>view('settings');$('cancel').onclick=()=>view('files');$('delete').onclick=()=>{if($('deletePin').value==='123456'){media.splice(pending,1);render();view('files')}};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice}};if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
